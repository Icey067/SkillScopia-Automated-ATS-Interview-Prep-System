[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
# CI catches syntax and undefined-name failures. Formatting is handled separately.
select = ["E9", "F63", "F7", "F82"]
